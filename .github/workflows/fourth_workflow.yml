name: Fourth workflow
on:
  workflow_run:
    workflows:
      - Third workflow
    types:
      - completed
jobs:
  hello-command:
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello
        run: echo "Hello"

  success-command:
    runs-on: ubuntu-latest
    if: $ {{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Print Success
        run: echo "Success"

  failure-command:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Print Failure
        run: echo "Failure"