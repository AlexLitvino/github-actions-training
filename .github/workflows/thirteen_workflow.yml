name: Thirteen workflow
on: [push]

jobs:
  run-first-command:
    runs-on: ubuntu-latest
    steps:
      - name: First command
        id: error-step
        run: exit 1 # sleep 30
      - name: Runs on Cancelled
        if: ${{ cancelled() }}
        run: echo "Runs on Cancelled"
      - name: Runs on any case
        if: ${{ always() }}
        run: echo "Runs on any case"
      - name: Runs on Success
        if: ${{ success() }}
        run: echo "Runs on Success"
      - name: Runs on Failure
        if: ${{ failure() }}
        run: echo "Runs on Failure"
      - name: Runs on specific step Failure
        if: ${{ failure() && steps.error-step.conclusion == 'failure' }}
        run: echo "Runs on Specific Step Failure"
  second-job:
    runs-on: ubuntu-latest
    needs: run-first-command
    if: ${{ failure() }}
    steps:
      - run: echo "Previous job was failed"